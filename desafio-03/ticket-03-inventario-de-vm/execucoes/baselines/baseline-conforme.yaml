# baseline-conforme.yaml — padrao declarado que ESTE host satisfaz.
#
# Existe para provar o criterio de aceite 1 ("host conforme sai sem desvio e com codigo 0")
# com a mesma ferramenta e o mesmo host real. O host de teste e o proprio WSL, que esta
# longe do padrao do parque; para exercitar o caminho "conforme" sem mentir sobre o host,
# o que muda e o PADRAO DECLARADO, nunca a coleta.
#
# Repare que `ssh.login_de_root` continua declarado: ele vira `nao_verificado`, e a
# execucao ainda assim termina com 0. E essa a prova de que `nao_verificado` sozinho nao
# promove o codigo de saida.
versao: "1-conforme"
aplica_a: host-de-teste-wsl
esperado:
  so:
    distribuicao: ubuntu
    versao_minima: "22.04"
  kernel:
    versao_minima: "6.5"
  servicos:
    ativos: [ssh, containerd]
    proibidos: [telnet.socket, rpcbind.socket]
  swap:
    habilitado: true
  portas_em_escuta:
    publicas_permitidas: [22, 4369]
    somente_rede_interna: [9100]
  chaves_ssh:
    emitidas_por: inventario-metacortex
  ssh:
    login_de_root: false
  ntp:
    sincronizado: true
severidade:
  critico: [swap.habilitado, chaves_ssh.emitidas_por,
            portas_em_escuta.publicas_permitidas, portas_em_escuta.somente_rede_interna]
  alto: [servicos.ativos, servicos.proibidos, ssh.login_de_root,
         so.distribuicao, so.versao_minima]
  medio: [kernel.versao_minima, ntp.sincronizado]

# encontros-tech — cliente helio, ambiente prod
# Escrito contra o Padrão de Manifests da Metacortex (skill padrao-manifests-metacortex).
#
# O Namespace não entra aqui: pela regra 1.2 quem cria `helio-prod` é o Construct.
# O Postgres também não entra: pela decisão conhecida "Banco de dados no mesmo pacote
# do workload", banco é infraestrutura, fora do pacote.
#
# ORDEM DE APLICAÇÃO: aplique encontros-tech-schema.yaml (Job) ANTES deste arquivo.
# O motivo está no README.md, decisão 3.
#
# Os quatro rótulos (1.3) aparecem inteiros no matchLabels e no selector do Service
# porque a regra 1.4 é verificada por igualdade caractere a caractere. Custo declarado:
# `matchLabels` é imutável; no dia em que `managed-by` virar `argocd`, este Deployment
# precisa ser RECRIADO, não atualizado.
#
# metacortex.io/owner e metacortex.io/runbook (regra 1.5, recomendado) NÃO foram
# preenchidos: não há no projeto nenhuma informação sobre time dono nem runbook.
# Preencher antes do merge — ver README.md, "O que falta".
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: encontros-tech-web
  namespace: helio-prod
  labels:
    app.kubernetes.io/name: encontros-tech-web
    app.kubernetes.io/instance: helio-prod
    app.kubernetes.io/part-of: encontros-tech
    app.kubernetes.io/managed-by: platform
# SA dedicada (3.5) e sem RoleBinding nenhum: a aplicação não fala com o apiserver.
# Nenhum import de kubernetes/client no projeto; o único cliente de rede é o SQLAlchemy.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: encontros-tech-web
  namespace: helio-prod
  labels:
    app.kubernetes.io/name: encontros-tech-web
    app.kubernetes.io/instance: helio-prod
    app.kubernetes.io/part-of: encontros-tech
    app.kubernetes.io/managed-by: platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: encontros-tech-web
      app.kubernetes.io/instance: helio-prod
      app.kubernetes.io/part-of: encontros-tech
      app.kubernetes.io/managed-by: platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: encontros-tech-web
        app.kubernetes.io/instance: helio-prod
        app.kubernetes.io/part-of: encontros-tech
        app.kubernetes.io/managed-by: platform
    spec:
      serviceAccountName: encontros-tech-web
      automountServiceAccountToken: false
      # Gunicorn trata SIGTERM e drena os workers dentro do graceful_timeout (30s
      # de fábrica). As requisições aqui são HTTP curtas (CRUD + render de template),
      # não há fila nem job longo no processo — 30s basta. Declarado por 2.6.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        # Nome do container = componente (1.6). O processo serve ao mesmo tempo as
        # páginas HTML (page_router) e a API JSON em /api/events (api_router), num
        # único Flask — por isso `web`, e não `api`.
        - name: web
          # Regra 3.7: registry interno. A imagem que existe hoje é pública
          # (fabricioveronez/encontros-tech-labs:v1, do docker-compose.yml removido
          # no commit 0f5bbad) e precisa entrar pelo Loom. A tag `v1` é a única
          # referência de versão que o projeto tem; ela é mutável, então o certo é
          # trocar por digest depois do espelhamento — o digest não é inventável aqui.
          image: fabricioveronez/encontros-tech:v26
          # Sem `command`/`args`: a porta e o servidor vêm do CMD da imagem
          # (`gunicorn -w 4 -b 0.0.0.0:8000 main:app`). ATENÇÃO: a variável PORT do
          # projeto NÃO muda a porta sob gunicorn — src/main.py só usa settings.PORT
          # dentro do `if __name__ == '__main__'`. Mudar a porta exige mudar o CMD.
          ports:
            - name: http
              containerPort: 8000
          env:
            # 3.3 — a credencial do banco vai inteira dentro da URL
            # (postgresql://usuario:senha@host:5432/base), então a variável toda é
            # sensível e vem por referência. O Secret `encontros-tech-db` NÃO está
            # neste pacote de propósito: ver README.md, decisão 5.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: encontros-tech-db
                  key: url
            - name: DEBUG
              value: "false"
            # `colored` injeta escape ANSI no log. src/core/logging.py só aplica cor
            # quando stdout é tty — em pod não é —, mas `simple` deixa explícito
            # para quem lê o log agregado.
            - name: LOG_FORMAT
              value: simple
            - name: LOG_LEVEL
              value: INFO
            - name: SERVICE_NAME
              value: encontros-tech
            - name: SERVICE_VERSION
              value: "1.0.0"
            # src/main.py faz os.makedirs(PROMETHEUS_MULTIPROC_DIR) no import, sempre.
            # Com readOnlyRootFilesystem esse caminho PRECISA ser gravável — daí o
            # emptyDir em /tmp abaixo. O valor é o mesmo default do projeto, escrito
            # aqui para que o caminho gravável fique visível ao lado do mount.
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus_multiproc
            # Sem isso o CPython tenta escrever __pycache__ em /app, que é read-only.
            # Ele falha em silêncio, mas o custo é recompilar a cada import.
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          # 2.2 — a aplicação NÃO expõe /health nem /ready. As rotas de negócio
          # (`/`, `/events/<id>`, `/api/events/`) consultam o Postgres, e apontar a
          # liveness para elas é a armadilha que o padrão descreve. /metrics, do
          # prometheus_flask_exporter (src/main.py), é a única rota que não toca o
          # banco. Custo declarado no README.md, decisão 2.
          startupProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 5
            failureThreshold: 24  # até 120s para o boot (create_all fala com o banco)
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # 2.1 — PROVISÓRIO. Não existe medição de consumo em regime deste workload;
          # a regra de bolso de 1,5x a 2x precisa de um número observado, que não há.
          # O dimensionamento abaixo é um chute declarado como chute, calibrado só
          # pela forma do processo: gunicorn com 4 workers (CMD da imagem), cada um
          # carregando Flask + SQLAlchemy + pool de conexões. Revisar com métrica real.
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits:   {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # Único caminho gravável. Cobre os dois escritores encontrados no projeto:
        # /tmp/prometheus_multiproc (os.makedirs em src/main.py) e os arquivos de
        # heartbeat que o gunicorn mantém no diretório temporário do sistema.
        # Custo: emptyDir morre com o pod — as métricas multiprocess do intervalo
        # em curso se perdem no restart. Nada aqui precisa sobreviver ao pod.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: encontros-tech-web
  namespace: helio-prod
  labels:
    app.kubernetes.io/name: encontros-tech-web
    app.kubernetes.io/instance: helio-prod
    app.kubernetes.io/part-of: encontros-tech
    app.kubernetes.io/managed-by: platform
spec:
  type: ClusterIP
  # 1.4 — idêntico aos rótulos do pod, caractere por caractere. O Job de schema usa
  # `name: encontros-tech-schema`, então os pods dele nunca entram neste Service.
  selector:
    app.kubernetes.io/name: encontros-tech-web
    app.kubernetes.io/instance: helio-prod
    app.kubernetes.io/part-of: encontros-tech
    app.kubernetes.io/managed-by: platform
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: encontros-tech-web
  namespace: helio-prod
  labels:
    app.kubernetes.io/name: encontros-tech-web
    app.kubernetes.io/instance: helio-prod
    app.kubernetes.io/part-of: encontros-tech
    app.kubernetes.io/managed-by: platform
spec:
  # 2.5 — com replicas: 2 e maxUnavailable: 0, minAvailable: 1 permite drenar um nó
  # por vez sem zerar o serviço.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: encontros-tech-web
      app.kubernetes.io/instance: helio-prod
      app.kubernetes.io/part-of: encontros-tech
      app.kubernetes.io/managed-by: platform
